# Render Blueprint: one-click production setup for the Xtreme-Home Partner API.
# Render dashboard → New → Blueprint → pick this repository. It creates the API (Docker),
# a PostgreSQL database and a Redis instance, and asks for the secrets marked sync: false.
services:
  - type: web
    name: xtreme-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    region: frankfurt
    plan: starter
    healthCheckPath: /ready
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8080"
      - key: DATABASE_URL
        fromDatabase: { name: xtreme-db, property: connectionString }
      - key: REDIS_URL
        fromService: { type: keyvalue, name: xtreme-redis, property: connectionString }
      - key: JWT_SECRET
        generateValue: true
      - key: OTP_PEPPER
        generateValue: true
      - key: PUBLIC_URL
        sync: false # e.g. https://api.xtreme-fmgroup.com
      - key: SMS_PROVIDER
        value: twilio
      - { key: TWILIO_ACCOUNT_SID, sync: false }
      - { key: TWILIO_AUTH_TOKEN, sync: false }
      - { key: TWILIO_FROM, sync: false }
      - { key: OTP_REVIEW_PHONES, sync: false }
      - { key: OTP_REVIEW_CODE, sync: false }
      - { key: GOOGLE_CLIENT_IDS, sync: false }
      - key: APPLE_BUNDLE_IDS
        value: ae.xtremefm.app
      - { key: FACEBOOK_APP_ID, sync: false }
      - { key: FACEBOOK_APP_SECRET, sync: false }
      - { key: STRIPE_SECRET_KEY, sync: false }
      - { key: STRIPE_PUBLISHABLE_KEY, sync: false }
      - { key: STRIPE_WEBHOOK_SECRET, sync: false }
      - key: TAMARA_API_URL
        value: https://api-sandbox.tamara.co # switch to https://api.tamara.co after Tamara's sign-off
      - { key: TAMARA_API_TOKEN, sync: false }
      - { key: TAMARA_NOTIFICATION_TOKEN, sync: false }
      - key: PUSH_ENABLED
        value: "true"
      - { key: EXPO_ACCESS_TOKEN, sync: false }
      - { key: ADMIN_PHONE, sync: false }

  - type: keyvalue
    name: xtreme-redis
    region: frankfurt
    plan: starter
    ipAllowList: []

databases:
  - name: xtreme-db
    region: frankfurt
    plan: basic-1gb
    databaseName: xtreme
    user: xtreme
