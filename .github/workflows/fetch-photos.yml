name: fetch-photos
# One-off helper: downloads free-licence photo (Pexels, or CC0 / public-domain Commons)
# candidates for each service to the "photo-candidates" branch, so the best ones can be chosen.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download candidates
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          mkdir -p out && cd out
          python3 - <<'PY'
          import json, os, urllib.request, urllib.parse
          # Pexels (free API key in the PEXELS_API_KEY secret; Pexels licence: free commercial use)
          # when available, otherwise Wikimedia Commons restricted to CC0 / public-domain files.
          Q = {
            "regular": "house cleaning", "deep": "deep cleaning kitchen", "sofa": "sofa living room", "mattress": "mattress bed",
            "carpet": "vacuum carpet", "glass": "window cleaning", "kitchen": "kitchen cleaning", "bathroom": "bathroom cleaning",
            "balcony": "apartment balcony", "wardrobe": "wardrobe closet", "restaurant": "restaurant kitchen", "cupboard": "kitchen cabinets",
          }
          UA = {"User-Agent": "XtremeCleaningPartner-photo-picker/1.0 (sales@xtreme-fmgroup.com)"}
          key_px = os.environ.get("PEXELS_API_KEY")
          credits = {}
          def get(url, headers=UA):
              return urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=40).read()
          for key, q in Q.items():
              found = []
              try:
                  if key_px:
                      data = json.loads(get("https://api.pexels.com/v1/search?" + urllib.parse.urlencode({"query": q, "per_page": 12, "orientation": "landscape"}), {**UA, "Authorization": key_px}))
                      found = [(p["src"]["large"], {"by": p["photographer"], "source": p["url"], "license": "Pexels"}) for p in data.get("photos", [])]
                  else:
                      api = "https://commons.wikimedia.org/w/api.php?" + urllib.parse.urlencode({
                          "action": "query", "format": "json", "generator": "search", "gsrnamespace": 6, "gsrlimit": 40,
                          "gsrsearch": q + " filetype:bitmap", "prop": "imageinfo", "iiprop": "url|extmetadata|size", "iiurlwidth": 900})
                      pages = json.loads(get(api)).get("query", {}).get("pages", {}).values()
                      for pg in pages:
                          ii = pg["imageinfo"][0]
                          lic = ii.get("extmetadata", {}).get("LicenseShortName", {}).get("value", "")
                          if not any(x in lic.lower() for x in ["cc0", "public domain", "pd"]): continue
                          if ii.get("width", 0) < 900 or ii.get("width", 0) < ii.get("height", 0): continue
                          found.append((ii["thumburl"], {"source": ii["descriptionurl"], "license": lic}))
              except Exception as e:
                  print("search failed", key, e)
              n = 0
              for url, meta in found:
                  name = f"{key}_{n}.jpg"
                  try:
                      body = get(url)
                  except Exception as e:
                      print("download failed", name, e); continue
                  if len(body) < 15000: continue
                  open(name, "wb").write(body)
                  credits[name] = meta
                  n += 1
                  if n >= 8: break
              print(key, n)
          json.dump(credits, open("credits.json", "w"), indent=1)
          PY
          ls | wc -l
      - name: Push to the photo-candidates branch
        run: |
          cd out
          git init -q -b photo-candidates
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Photo candidates"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" photo-candidates
