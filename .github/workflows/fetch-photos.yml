name: fetch-photos
# One-off helper: downloads free-licence (Unsplash licence, commercial use allowed) photo
# candidates for each service to the "photo-candidates" branch, so the best ones can be chosen.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download candidates
        run: |
          mkdir -p out && cd out
          python3 - <<'PY'
          import json, urllib.request, urllib.parse
          Q = {
            "regular": "home cleaning service", "deep": "professional deep cleaning", "sofa": "sofa cleaning",
            "mattress": "mattress bed clean", "carpet": "carpet cleaning", "glass": "window cleaning",
            "kitchen": "kitchen cleaning", "bathroom": "bathroom cleaning", "balcony": "apartment balcony",
            "wardrobe": "wardrobe closet", "restaurant": "restaurant kitchen", "cupboard": "kitchen cabinets",
          }
          UA = {"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36", "Accept": "application/json"}
          credits = {}
          for key, q in Q.items():
              url = "https://unsplash.com/napi/search/photos?" + urllib.parse.urlencode({"query": q, "per_page": 20})
              try:
                  data = json.load(urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=30))
              except Exception as e:
                  print("search failed", key, e); continue
              n = 0
              for r in data.get("results", []):
                  if r.get("premium") or r.get("plus"): continue
                  if "images.unsplash.com/photo-" not in r["urls"]["raw"]: continue
                  img = r["urls"]["raw"] + "&w=900&q=72&fm=jpg&fit=crop&ar=16:10"
                  name = f"{key}_{n}.jpg"
                  try:
                      open(name, "wb").write(urllib.request.urlopen(urllib.request.Request(img, headers={"User-Agent": UA["User-Agent"]}), timeout=30).read())
                  except Exception as e:
                      print("download failed", name, e); continue
                  credits[name] = {"id": r["id"], "by": r["user"]["name"], "page": r["links"]["html"], "alt": r.get("alt_description")}
                  n += 1
                  if n >= 6: break
              print(key, n)
          json.dump(credits, open("credits.json", "w"), indent=1)
          PY
          ls | wc -l
      - name: Push to the photo-candidates branch
        run: |
          cd out
          git init -q -b photo-candidates
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Photo candidates"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" photo-candidates
