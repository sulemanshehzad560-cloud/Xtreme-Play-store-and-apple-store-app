name: fetch-photos
# One-off helper: downloads public-domain / CC0 photo
# candidates for each service to the "photo-candidates" branch, so the best ones can be chosen.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download candidates
        run: |
          mkdir -p out && cd out
          python3 - <<'PY'
          import json, urllib.request, urllib.parse
          # Openverse (by WordPress): open-licence images. Only CC0 / public domain, so they are
          # free for commercial use with no credit required.
          Q = {
            "regular": "house cleaning", "deep": "cleaning kitchen", "sofa": "sofa", "mattress": "mattress",
            "carpet": "vacuum carpet", "glass": "window cleaning", "kitchen": "clean kitchen", "bathroom": "bathroom",
            "balcony": "balcony", "wardrobe": "wardrobe closet", "restaurant": "restaurant kitchen", "cupboard": "kitchen cabinets",
          }
          UA = {"User-Agent": "XtremeCleaningPartner-photo-picker/1.0 (sales@xtreme-fmgroup.com)"}
          credits = {}
          for key, q in Q.items():
              url = "https://api.openverse.org/v1/images/?" + urllib.parse.urlencode({"q": q, "license": "cc0,pdm", "page_size": 20, "aspect_ratio": "wide", "size": "large", "mature": "false"})
              try:
                  data = json.load(urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=40))
              except Exception as e:
                  print("search failed", key, e); continue
              n = 0
              for r in data.get("results", []):
                  name = f"{key}_{n}.jpg"
                  try:
                      body = urllib.request.urlopen(urllib.request.Request(r["url"], headers=UA), timeout=40).read()
                  except Exception as e:
                      print("download failed", name, e); continue
                  if len(body) < 20000: continue
                  open(name, "wb").write(body)
                  credits[name] = {"title": r.get("title"), "by": r.get("creator"), "license": r.get("license"), "source": r.get("foreign_landing_url")}
                  n += 1
                  if n >= 8: break
              print(key, n)
          json.dump(credits, open("credits.json", "w"), indent=1)
          PY
          ls | wc -l
      - name: Push to the photo-candidates branch
        run: |
          cd out
          git init -q -b photo-candidates
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Photo candidates"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" photo-candidates
