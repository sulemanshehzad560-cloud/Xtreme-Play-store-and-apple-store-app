name: apk-to-branch
# Copies the latest Android test APK from the "android-test" release onto the
# apk-download branch (single commit, replaced each time), so it can be fetched with git.
on:
  workflow_dispatch:
  workflow_run:
    workflows: [android-apk]
    types: [completed]

permissions:
  contents: write

jobs:
  copy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download the APK from the release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          mkdir out && cd out
          gh release download android-test --repo "$GITHUB_REPOSITORY" --pattern '*.apk'
          gh release view android-test --repo "$GITHUB_REPOSITORY" --json body --jq .body > BUILD.txt
          ls -la
      - name: Push to the apk-download branch
        working-directory: out
        run: |
          git init -q -b apk-download
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Android test APK"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" apk-download
