name: store-builds
# Production builds for Google Play (AAB) and the App Store (IPA) on Expo EAS, with an
# optional automatic upload to both stores. Needs the repository secret EXPO_TOKEN
# (expo.dev → Account settings → Access tokens). Signing keys are managed by EAS.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: "android, ios or all"
        default: all
      submit:
        description: "Upload to the stores when the build finishes (true/false)"
        default: "false"
      profile:
        description: "production (store builds), playtest (Play AAB on the test server) or preview (installable test APK on the test server)"
        default: production

jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: mobile/package-lock.json }
      - name: Check EXPO_TOKEN
        env: { EXPO_TOKEN: "${{ secrets.EXPO_TOKEN }}" }
        run: test -n "$EXPO_TOKEN" || (echo "::error::Add the EXPO_TOKEN repository secret first" && exit 1)
      - uses: expo/expo-github-action@v8
        with: { eas-version: latest, token: "${{ secrets.EXPO_TOKEN }}" }
      - run: npm ci --legacy-peer-deps
      - run: npx tsc --noEmit
      - name: Build
        run: eas build --platform ${{ github.event.inputs.platform }} --profile ${{ github.event.inputs.profile || 'production' }} --non-interactive ${{ github.event.inputs.submit == 'true' && '--auto-submit' || '--no-wait' }}
